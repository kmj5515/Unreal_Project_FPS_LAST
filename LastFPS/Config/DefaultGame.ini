; ─────────────────────────────────────────────────────────────
; 마스터 로비 (서버 PC 상시 구동 로비 서버)
; 로비 맵은 네이티브 GameMode/PlayerController를 직접 사용하므로
; Blueprint 기본값 대신 여기에서 설정을 주입한다.
; ─────────────────────────────────────────────────────────────
[/Script/LastFPS.LastFPSMasterLobbyGameMode]
MinPlayersPerRoom=2
MaxPlayersPerRoom=4
MaxRoomNameLength=24
MaxActiveRooms=64
; 호스트 Beacon 하트비트가 이 시간 동안 없으면 방을 목록에서 지운다.
; 호스트 하트비트 주기(10초)보다 넉넉해야 일시적 패킷 손실로 방이 사라지지 않는다.
RoomTimeoutSeconds=45.0
RoomSweepIntervalSeconds=10.0
; 방 등록/하트비트를 받는 포트. 게임 포트와 달라야 하고 방화벽·포트포워딩도 필요하다.
BeaconPort=15000
; 호스트가 리슨 서버를 여는 포트. 아래 LastFPSMasterLobbySettings의 HostGamePort와 같아야 한다.
HostGamePort=7777

[/Script/LastFPS.LastFPSMasterLobbyPC]
LobbyWidgetClass=/Game/UI/WBP_MasterLobby.WBP_MasterLobby_C

; 마스터 로비 서버 접속 주소. 클라이언트가 메인 메뉴에서 이 주소로 접속한다.
; 172.30.1.15는 사설 IP라 같은 네트워크 안에서만 접속된다.
; 외부 배포본은 공인 IP나 도메인으로 바꾸거나, 실행 인자로 덮어쓴다.
;   LastFPS.exe -MasterServer=203.0.113.10:7777
[/Script/LastFPS.LastFPSMasterLobbySettings]
ServerAddress=172.30.1.15
