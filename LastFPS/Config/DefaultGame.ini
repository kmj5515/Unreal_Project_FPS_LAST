BeaconPort=15000
CommandLineOverrideKey=MasterServer
; 방을 개설한 호스트가 리슨 서버로 열 맵이다. 비워 두면 방 개설이 실패한다.
; 전투 맵을 직접 열면 파티원 입장/준비를 확인할 자리가 없으므로 파티 대기 맵을 연다.
; 대기 맵의 World Settings GameMode는 ALastFPSPartyGameMode이고, 실제 전투 맵으로는
; 아래 [/Script/LastFPS.LastFPSPartyGameMode] DefaultBattleMap이 ServerTravel 목적지가 된다.
